<style>
:root{--ink:#0F172A;--gray:#64748B;--line:#E2E8F0;--panel:#F1F5F9;--bg:#fff;--card:#fff;--acc:#0B4A5E;--acc-t:#E3EFF2;--tron:#C8372D;--tron-t:#FBECEA;--eth:#4F46C8;--eth-t:#ECEBFB;--ocre:#B7791F;--ocre-t:#FAF1DF;--ice:#2B7BB9;--ice-t:#E4F1FB;--warn:#FFF4CC;--warn-i:#7A5B00;--ok:#1B7F4B}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--ink:#E6EDF3;--gray:#9AA8B8;--line:#26323F;--panel:#151D26;--bg:#0C1218;--card:#101820;--acc:#5BB6CF;--acc-t:#12323C;--tron-t:#3A1A18;--eth-t:#1F1E40;--ocre-t:#3A2D12;--ice-t:#122A3D;--warn:#3A3210;--warn-i:#F2D575;--ok:#4FC98A}}
:root[data-theme=dark]{--ink:#E6EDF3;--gray:#9AA8B8;--line:#26323F;--panel:#151D26;--bg:#0C1218;--card:#101820;--acc:#5BB6CF;--acc-t:#12323C;--tron-t:#3A1A18;--eth-t:#1F1E40;--ocre-t:#3A2D12;--ice-t:#122A3D;--warn:#3A3210;--warn-i:#F2D575;--ok:#4FC98A}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Arial,Helvetica,sans-serif}
a{color:var(--acc);text-decoration:none;font-weight:600}a:hover{text-decoration:underline}
code,.mono{font-family:"Courier New",ui-monospace,monospace;overflow-wrap:anywhere;word-break:break-all}
#banner{position:sticky;top:0;z-index:30;background:#B91C1C;color:#fff;text-align:center;font-size:13px;font-weight:700;letter-spacing:.04em;padding:7px 12px}
header.top{position:sticky;top:31px;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1400px;margin:0 auto;padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{font-weight:800;font-size:19px;color:var(--ink)}.brand small{display:block;font-size:12px;font-weight:600;color:var(--gray);letter-spacing:.06em;text-transform:uppercase}
nav{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;padding-bottom:2px}
@media(max-width:760px){.bar{padding:8px 12px;gap:8px}.brand{flex:1}nav{order:3;flex:0 0 100%}.tz{order:2}h1{font-size:25px}}
nav a{white-space:nowrap;padding:9px 14px;border-radius:999px;color:var(--ink);font-weight:600;font-size:15px;min-height:40px;display:flex;align-items:center}
nav a.on{background:var(--acc);color:#fff}nav a:hover{background:var(--panel);text-decoration:none}nav a.on:hover{background:var(--acc)}
.tz{font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 12px;cursor:pointer;min-height:40px}
main{max-width:1100px;margin:0 auto;padding:22px 16px 60px}
footer{max-width:1100px;margin:0 auto;padding:18px 16px 40px;color:var(--gray);font-size:13px;border-top:1px solid var(--line)}
h1{font-size:30px;line-height:1.15;margin:.2em 0 .3em}h2{font-size:21px;margin:0 0 10px}h3{font-size:17px;margin:18px 0 6px}
.sub{color:var(--gray);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:0 0 16px}
.grid{display:grid;gap:16px}@media(min-width:760px){.grid.two{grid-template-columns:1fr 1fr}}
form.search{display:flex;gap:8px;flex-wrap:wrap}
input[type=text],input[type=password],input[type=number],textarea,select{font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);min-height:46px}
input[type=text],textarea{flex:1;min-width:0;width:100%}textarea{resize:vertical;font-family:"Courier New",monospace}
form.search input{flex:1 1 260px}
button,.btn{font:inherit;font-weight:700;font-size:16px;padding:11px 18px;border:0;border-radius:10px;background:var(--acc);color:#fff;cursor:pointer;min-height:46px;display:inline-flex;align-items:center;justify-content:center}
button.sec,.btn.sec{background:var(--panel);color:var(--ink);border:1px solid var(--line)}button:disabled{opacity:.5;cursor:not-allowed}
.chip{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.06em;padding:3px 9px;border-radius:999px;text-transform:uppercase;vertical-align:middle}
.chip.tron{background:var(--tron-t);color:var(--tron)}.chip.eth{background:var(--eth-t);color:var(--eth)}.chip.ocre{background:var(--ocre-t);color:var(--ocre)}.chip.ice{background:var(--ice-t);color:var(--ice)}.chip.ok{background:var(--acc-t);color:var(--acc)}
.lbl{display:inline-block;background:var(--acc-t);color:var(--acc);border-radius:6px;padding:1px 7px;font-size:13px;font-weight:700;margin-left:6px}
.addr{font-family:"Courier New",monospace;font-size:15px;overflow-wrap:anywhere;word-break:break-all}
.kv{display:grid;grid-template-columns:1fr;gap:2px 16px}@media(min-width:700px){.kv{grid-template-columns:200px 1fr}}
.kv dt{color:var(--gray);font-weight:700;font-size:14px;margin-top:10px}@media(min-width:700px){.kv dt{margin-top:0;padding:8px 0}}.kv dd{margin:0;padding:0 0 4px;overflow-wrap:anywhere}@media(min-width:700px){.kv dd{padding:8px 0}}
.kv{border-top:1px solid var(--line)}
.tx{display:grid;gap:4px 14px;padding:12px 0;border-top:1px solid var(--line);grid-template-columns:1fr}
@media(min-width:760px){.tx{grid-template-columns:200px 110px 1fr 190px;align-items:center}}
.tx .v{font-weight:800;text-align:left}@media(min-width:760px){.tx .v{text-align:right}}
.in{color:var(--ok)}.out{color:var(--tron)}
.bal{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0}.bal div{background:var(--panel);border-radius:12px;padding:10px 16px;min-width:150px}.bal b{display:block;font-size:22px}.bal span{color:var(--gray);font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.note{background:var(--warn);color:var(--warn-i);border-radius:10px;padding:10px 14px;font-size:15px;margin:10px 0}
.frozen{background:var(--ice-t);color:var(--ice);border:2px solid var(--ice);border-radius:12px;padding:12px 16px;margin:12px 0;font-weight:700}
.tabs{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap}.tabs a{padding:8px 14px;border-radius:8px;background:var(--panel);color:var(--ink);font-size:15px}.tabs a.on{background:var(--acc);color:#fff}
table.t{width:100%;border-collapse:collapse;font-size:15px}.t th{text-align:left;color:var(--gray);font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:8px 8px;border-bottom:2px solid var(--line)}.t td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.t tr.hit td{background:var(--acc-t);font-weight:700}
.tscroll{overflow-x:auto}
.timeline{border-left:3px solid var(--ocre);margin:10px 0 0 8px;padding-left:18px}.timeline .st{margin:0 0 18px;position:relative}.timeline .st:before{content:"";position:absolute;left:-26px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--ocre)}
.docs{display:grid;gap:12px}.doc{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--card)}
.doc .st{font-size:13px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.docview{background:#fff;color:#111;border:1px solid var(--line);border-radius:6px;padding:24px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.docview h2{font-size:22px}.docview h3{font-size:16px}.docview .fic{background:#FFF4CC;color:#7A5B00;font-size:13px;padding:6px 10px;border-radius:6px}.docview .obs{background:#F1F5F9;padding:8px 12px;border-left:4px solid #0B4A5E}
table.dt{width:100%;border-collapse:collapse;margin:8px 0;font-size:15px}.dt th:first-child{min-width:5em}.dt th,.dt td{border:1px solid #CBD5E1;padding:7px 9px;text-align:left;vertical-align:top;overflow-wrap:anywhere}.dt th{background:#F1F5F9}.dt code{font-size:13px}
.chips{max-width:100%;display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0 4px}.chips span.c{font-family:"Courier New",monospace;font-weight:800;font-size:20px;background:var(--panel);padding:8px 12px;border-radius:10px}.chips span.c.hot{background:var(--acc);color:#fff}.chips i{color:var(--gray);font-style:normal;font-size:20px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin:10px 0}.row label{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:700;color:var(--gray)}.row label input,.row label select{min-width:0}
.hint{border:1px dashed var(--line);border-radius:10px;padding:10px 14px;margin:8px 0}
.small{font-size:14px;color:var(--gray)}
.ok-t{color:var(--ok);font-weight:700}.bad-t{color:var(--tron);font-weight:700}
.copy{font-size:13px;padding:4px 10px;min-height:30px;border-radius:8px}
@media print{.docview{box-shadow:none;border:0}}

:root{--ink:#14181F;--gray:#667085;--line:#E6E3DC;--panel:#F0EEE8;--bg:#F7F6F3;--card:#fff;--acc:#0B4A5E;--acc-t:#E4EFF2;--on-acc:#fff;--logofg:#fff;--tron:#D1432F;--tron-t:#FBECE8;--eth:#5B52D6;--eth-t:#ECEBFB;--ok:#17734B;--out:#B4362A;--amb:#C98A1B;--sh:0 1px 2px rgba(20,24,31,.04),0 4px 16px rgba(20,24,31,.04)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--ink:#E8ECEF;--gray:#97A1AD;--line:#252C33;--panel:#1A2127;--bg:#0D1114;--card:#14191E;--acc:#63BAD1;--acc-t:#132A32;--on-acc:#06222B;--logofg:#06222B;--tron:#F0725F;--tron-t:#3A1A18;--eth:#8F88F0;--eth-t:#1F1E40;--ok:#5BC48E;--out:#F0806F;--amb:#E0A53A;--sh:none}}
:root[data-theme=dark]{--ink:#E8ECEF;--gray:#97A1AD;--line:#252C33;--panel:#1A2127;--bg:#0D1114;--card:#14191E;--acc:#63BAD1;--acc-t:#132A32;--on-acc:#06222B;--logofg:#06222B;--tron:#F0725F;--tron-t:#3A1A18;--eth:#8F88F0;--eth-t:#1F1E40;--ok:#5BC48E;--out:#F0806F;--amb:#E0A53A;--sh:none}
html{scroll-behavior:smooth}
body{font:17px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-feature-settings:"cv11","ss03";-webkit-font-smoothing:antialiased}
a{color:var(--acc);font-weight:600}a:hover{text-decoration:underline;text-underline-offset:3px}
code,.mono,.addr{font-family:"JetBrains Mono",ui-monospace,"Courier New",monospace;letter-spacing:-.01em}
.addr{font-size:.88em}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.125em}
header.top{top:0;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.bar{max-width:1320px;padding:0 24px;gap:16px;height:68px;flex-wrap:nowrap}
.brand{display:flex;gap:12px;align-items:center;flex:none;font-weight:inherit;font-size:inherit;color:var(--ink)}.brand:hover{text-decoration:none}
.brand .logo{width:36px;height:36px;flex:none}.brand b{display:block;font-size:16px;font-weight:650;letter-spacing:-.015em;line-height:1.2}
.brand small{display:block;font-size:12px;font-weight:500;color:var(--gray);letter-spacing:.01em;text-transform:none}
header.top nav{gap:2px;padding:0;height:100%;scrollbar-width:none}header.top nav::-webkit-scrollbar{display:none}
header.top nav a{position:relative;border-radius:0;min-height:0;padding:0 8px;font-size:15px;font-weight:500;color:var(--gray)}
header.top nav a:hover{background:transparent;color:var(--ink);text-decoration:none}
header.top nav a.on,header.top nav a.on:hover{background:transparent;color:var(--ink);font-weight:600}
header.top nav a.on:after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;background:var(--acc);border-radius:2px}
.tools{display:flex;gap:10px;align-items:center;flex:none}
.fict{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--gray);border:1px solid var(--line);background:var(--card);padding:6px 11px;border-radius:999px;white-space:nowrap}
.fict i{width:7px;height:7px;border-radius:50%;background:var(--amb)}.fict .s{display:none}
.tz{font:inherit;font-size:13px;font-weight:600;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 12px;min-height:0;cursor:pointer}
main{max-width:1320px;padding:40px 24px 72px}
footer{max-width:1320px;padding:22px 24px 44px;border-top:1px solid var(--line)}
h1{font-size:40px;line-height:1.1;letter-spacing:-.03em;font-weight:680;margin:.25em 0 .3em}
h2{font-size:19px;letter-spacing:-.015em;font-weight:650}h3{letter-spacing:-.01em;font-weight:650}
.sub{color:var(--gray);font-size:17.5px;max-width:42em;margin:0 0 26px}
.eyebrow{font-size:13px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
.card{border-radius:16px;padding:22px;box-shadow:var(--sh)}
input[type=text],input[type=password],input[type=number],textarea,select{font-family:inherit;border-radius:11px;background:var(--card)}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-t)}
button,.btn{font-family:inherit;font-weight:600;font-size:15.5px;border-radius:11px;color:var(--on-acc);transition:filter .15s,background .15s}
button:hover:not(:disabled),.btn:hover{filter:brightness(1.08)}
button.sec,.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}button.sec:hover:not(:disabled){background:var(--panel);filter:none}
form.search{display:flex;flex-wrap:nowrap;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:7px 7px 7px 18px;box-shadow:var(--sh);transition:border-color .15s,box-shadow .15s}
form.search:focus-within{border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-t)}
form.search input{flex:1 1 auto;border:0;background:transparent;min-height:0;padding:12px 0;box-shadow:none!important;font-size:17px}
form.search svg.i{font-size:20px;color:var(--gray)}
.card form.search{box-shadow:none}
.chip{font-family:inherit;font-weight:650;letter-spacing:.05em;font-size:11.5px}
.chip.tron,.chip.eth,.chip.ok{background:transparent;padding:0}
.chip.tron{color:var(--tron)}.chip.eth{color:var(--eth)}.chip.ok{color:var(--ok)}
.lbl{border-radius:7px;font-weight:650;font-size:12.5px}
.kv{border-top:1px solid var(--line)}.kv dt{font-weight:600}
.note{border-radius:12px}.frozen{border-radius:14px}
.tabs a{background:var(--card);border:1px solid var(--line);border-radius:10px;font-weight:600}.tabs a.on{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
table.t th{font-weight:650}
.doc{border-radius:14px;box-shadow:var(--sh)}
.crumb{font-size:14px;color:var(--gray);display:flex;gap:8px;align-items:center}.crumb a{color:var(--gray);font-weight:500}.crumb a:hover{color:var(--ink);text-decoration:none}
/* início */
.hero{margin:0 0 8px}.hero h1{max-width:16em;font-size:44px}
.blk{margin-top:44px}.blk h2{font-size:15px;margin:0 0 4px}.blk .cap{color:var(--gray);font-size:15px;margin:0 0 16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.start{padding:16px;display:flex;flex-direction:column;gap:9px;color:var(--ink);font-weight:inherit;transition:border-color .15s,transform .15s}.start:hover{border-color:var(--acc);transform:translateY(-1px);text-decoration:none}
.start .top{display:flex;justify-content:space-between;align-items:center}
.tag{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--gray)}.tag i{width:8px;height:8px;border-radius:50%;background:var(--tron)}
.start b{font-size:16px;font-weight:620;letter-spacing:-.01em}.start .addr{color:var(--gray);font-size:13px;font-weight:500}
.cp{display:inline-flex;align-items:center;gap:6px;color:var(--gray);border:0;background:transparent;font-size:12.5px;font-weight:600;cursor:pointer;padding:4px 6px;min-height:0;border-radius:7px}.cp:hover{background:var(--panel);color:var(--ink);filter:none}
.tool{display:flex;gap:14px;padding:18px;align-items:flex-start;color:var(--ink);font-weight:inherit;transition:border-color .15s}.tool:hover{border-color:var(--acc);text-decoration:none}
.tool .ic{width:40px;height:40px;border-radius:11px;background:var(--acc-t);color:var(--acc);display:grid;place-items:center;font-size:20px;flex:none}
.tool b{display:block;font-size:16px;font-weight:620;letter-spacing:-.01em}.tool span.d{display:block;color:var(--gray);font-size:14.5px;line-height:1.45;margin-top:2px;font-weight:400}
.dl{display:flex;align-items:center;gap:20px;padding:20px 22px;flex-wrap:wrap}.dl .t{flex:1;min-width:260px}.dl .t b{font-weight:620}.dl .t span{display:block;color:var(--gray);font-size:14.5px}
.chips2{display:flex;gap:8px;flex-wrap:wrap}.chip2{display:inline-flex;gap:6px;align-items:center;font-size:13.5px;font-weight:600;padding:7px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--ink)}.chip2:hover{border-color:var(--acc);text-decoration:none}.chip2 svg{font-size:14px;color:var(--gray)}
/* endereço */
.head{margin:18px 0 26px}.net{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:650;padding:5px 11px;border-radius:999px}.net i{width:7px;height:7px;border-radius:50%}
.net.tron{color:var(--tron);background:color-mix(in srgb,var(--tron) 10%,transparent)}.net.tron i{background:var(--tron)}
.net.eth{color:var(--eth);background:color-mix(in srgb,var(--eth) 11%,transparent)}.net.eth i{background:var(--eth)}
.addrline{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:14px}.addrline .addr{font-size:23px;font-weight:550;letter-spacing:-.02em;overflow-wrap:anywhere;word-break:normal}
.cpb{display:inline-flex;gap:7px;align-items:center;font-size:14px;font-weight:600;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:0;cursor:pointer}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);margin-bottom:22px;padding:0;margin-top:0}.metrics div{padding:20px 24px}.metrics div+div{border-left:1px solid var(--line)}
.metrics span{font-size:12.5px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--gray)}.metrics b{display:block;font-size:30px;letter-spacing:-.025em;font-weight:650;margin-top:4px;font-variant-numeric:tabular-nums}
.txc{padding:0;overflow:hidden}.txh{display:flex;justify-content:space-between;align-items:baseline;padding:20px 24px 12px}.txh h2{font-size:18px;margin:0}.txh span{font-size:14px;color:var(--gray)}
.tx{display:grid;grid-template-columns:minmax(190px,1.2fr) 150px 1.2fr 190px 44px;gap:16px;align-items:center;padding:15px 24px;border-top:1px solid var(--line);transition:background .12s}.tx:hover{background:var(--panel)}
.tx.hd{padding-top:9px;padding-bottom:9px;font-size:12px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--gray)}.tx.hd:hover{background:transparent}
.tx .hh{font-weight:550}.dtc{color:var(--gray);font-size:14.5px;font-variant-numeric:tabular-nums}
.dirc{display:flex;align-items:center;gap:12px;min-width:0}.dirc .arr{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:15px;flex:none}
.dirc.in .arr{background:color-mix(in srgb,var(--ok) 13%,transparent);color:var(--ok)}.dirc.out .arr{background:color-mix(in srgb,var(--out) 12%,transparent);color:var(--out)}
.dirc small{display:block;color:var(--gray);font-size:12.5px;font-weight:600;line-height:1.2}
.valc{text-align:right;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.01em}.valc.in{color:var(--ok)}.valc.out{color:var(--out)}.valc small{color:var(--gray);font-weight:600;font-size:12.5px;margin-left:5px}
.lk{display:grid;place-items:center;width:32px;height:32px;min-height:0;padding:0;border-radius:9px;color:var(--gray);background:transparent;border:0;position:relative;justify-self:end;cursor:help;font-size:17px}
button.lk{cursor:pointer}.lk:hover{background:var(--panel);color:var(--ink);filter:none}.lk.on{background:var(--acc-t);color:var(--acc)}.lk.none{cursor:default;pointer-events:none}
.lk[data-tip]:hover:after,.lk[data-tip]:focus-visible:after{content:attr(data-tip);position:absolute;right:0;bottom:calc(100% + 8px);width:250px;background:var(--ink);color:var(--bg);font-size:12.5px;font-weight:500;line-height:1.4;padding:9px 11px;border-radius:9px;z-index:5;text-align:left;letter-spacing:0}
@media(max-width:900px){.grid4{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:1fr 1fr}.fict .l{display:none}.fict .s{display:inline}}
@media(max-width:720px){.bar{height:auto;flex-wrap:wrap;gap:8px 12px;padding:12px 16px 0}.brand{flex:1}header.top nav{order:3;flex:0 0 100%;height:44px;margin:0 -4px}
main{padding:26px 16px 56px}h1,.hero h1{font-size:31px}.sub{font-size:16.5px}.grid3{grid-template-columns:1fr}form.search{padding-left:14px}.sbtn span{display:none}.sbtn{padding:13px 14px}
.metrics{grid-template-columns:1fr}.metrics div+div{border-left:0;border-top:1px solid var(--line)}.metrics div{padding:14px 20px;display:flex;justify-content:space-between;align-items:baseline}.metrics b{margin:0;font-size:24px}
.addrline .addr{font-size:16.5px}
.tx{grid-template-columns:1fr auto;gap:6px 12px;padding:14px 18px}.tx.hd{display:none}.tx .hh{grid-column:1}.tx .dtc{grid-column:1;grid-row:2}.tx .dirc{grid-column:1;grid-row:3;margin-top:6px}.tx .valc{grid-column:2;grid-row:1}.tx .lk{grid-column:2;grid-row:3}.txh{padding:18px}}
@media print{header.top,footer,.noprint{display:none!important}}

.pain{--acc:#D93600;--acc-t:#FFEDE5;--on-acc:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .pain{--acc:#FF6A3D;--acc-t:#3A1A10;--on-acc:#2A0E04}}
.pl-head{display:flex;align-items:center;gap:22px;flex-wrap:wrap;padding:6px 2px 18px;margin-bottom:18px;border-bottom:1px solid var(--line)}
.pl-logo{display:block;height:46px;aspect-ratio:1000/222;background:var(--pl-logo) no-repeat left center/contain}
.pl-sub{flex:1;min-width:240px;color:var(--gray);font-size:14.5px;line-height:1.35}.pl-sub b{display:block;color:var(--ink);font-weight:620;font-size:15.5px}
.pl-badge{font-size:12px;font-weight:650;letter-spacing:.04em;color:var(--gray);border:1px solid var(--line);border-radius:999px;padding:5px 11px;background:var(--card);white-space:nowrap}
.pain .rt-bar button:not(.sec){background:var(--acc)}
#painsplash{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;cursor:pointer;animation:psp 2.4s ease forwards}
#painsplash .pl-big{width:min(78vw,560px);aspect-ratio:1000/222;background:var(--pl-logo) no-repeat center/contain;animation:pin .9s cubic-bezier(.2,.8,.2,1) both}
#painsplash p{margin:0;color:var(--gray);font-size:15px;letter-spacing:.02em;animation:pin .9s .35s both}
@keyframes pin{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
@keyframes psp{0%,78%{opacity:1}100%{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){#painsplash,#painsplash .pl-big,#painsplash p{animation-duration:1.2s}}
@media(max-width:720px){.pl-logo{height:38px}}

.start a{color:var(--ink);font-weight:inherit;display:flex;flex-direction:column;gap:9px}.start a:hover{text-decoration:none}.start:hover{border-color:var(--acc);transform:translateY(-1px)}
.start .addr{font-weight:500}

form.search .sbtn svg.i{color:inherit;font-size:18px}
.card form.search{border:0;padding:0;background:transparent;gap:10px;box-shadow:none}
.card form.search:focus-within{box-shadow:none}
.card form.search input{border:1px solid var(--line);padding:12px 14px;border-radius:11px;background:var(--card);min-height:48px}
.card form.search input:focus{border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-t)!important}

:root[data-theme=dark] .pain{--acc:#FF6A3D;--acc-t:#3A1A10;--on-acc:#2A0E04}
.tz.th{display:grid;place-items:center;width:36px;height:34px;padding:0;font-size:17px}

 c.push(pcOk(["5 dias","10 dias"].includes(S.prazo),!S.prazo?"Escolha o prazo":(S.prazo==="sem"?"Sem prazo: a empresa pode não responder":(["5 dias","10 dias"].includes(S.prazo)?"Prazo adequado":"Prazo longo para uma diligência urgente"))));
 c.push(pcOk(S.email,S.email?"Indica o canal de resposta por e-mail institucional":"Falta indicar o canal de resposta por e-mail institucional"));
 c.push(pcOk(S.sig,S.sig?"Pede que o titular não seja cientificado":"Falta pedir que a empresa não cientifique o titular"));
 return c}
function nxForm(S){
 const cb=(p,v,tx,on)=>`<label class="pc-cb"><input type="checkbox" data-nxl="${p}" value="${v}"${on?" checked":""}> ${tx}</label>`;
 return `<h3>Transação de entrada na NexoFloat</h3><p class="small">Copie do explorador a transação em que o coletor enviou USDT à NexoFloat.</p>
 <label class="small">Hash da transação<input type="text" data-nx="hash" value="${esc(S.hash)}" autocomplete="off" spellcheck="false" style="width:100%;font:13px monospace"></label>
 <label class="small">Endereço de depósito da NexoFloat<input type="text" data-nx="dep" value="${esc(S.dep)}" autocomplete="off" spellcheck="false" style="width:100%;font:13px monospace"></label>
 <div class="row"><label class="small">Data e hora da entrada<input type="text" data-nx="dt" value="${esc(S.dt)}" placeholder="dd/mm/aaaa hh:mm" autocomplete="off"></label><label class="small">Fuso<select data-nx="fz"><option value="">Escolha</option><option value="gmt3"${S.fz==="gmt3"?" selected":""}>GMT-3</option><option value="utc"${S.fz==="utc"?" selected":""}>UTC</option></select></label></div>
 <h3>Fundamentos</h3>${NX_FUN.map(f=>cb("fund",f[0],f[1],S.fund.includes(f[0]))).join("")}
 <h3>Informações requisitadas</h3>${NX_PED.map(p=>cb("ped",p[0],p[1],S.ped.includes(p[0]))).join("")}
 <h3>Prazo e canal</h3><div class="row"><label class="small">Prazo<select data-nx="prazo">${NX_PRZ.map(e=>`<option value="${e[0]}"${S.prazo===e[0]?" selected":""}>${e[1]}</option>`).join("")}</select></label></div>
 <label class="pc-cb"><input type="checkbox" data-nxb="email"${S.email?" checked":""}> Resposta por e-mail institucional da autoridade</label>
 <label class="pc-cb"><input type="checkbox" data-nxb="sig"${S.sig?" checked":""}> Pedir que a empresa não cientifique o titular</label>`}
function nxOficio(pres){const S=nxGet();
 return `<div class="card"><h2>Ofício à NexoFloat</h2><p class="small">A empresa tem o cadastro e os registros da ordem. Monte o ofício com os dados do explorador: o texto é gerado a partir das suas escolhas e a conferência aponta o que corrigir. A resposta chega pelo cofre, com o código do professor.</p></div>
 <div class="pc-grid"><div class="card pc-form" id="nxform">${nxForm(S)}</div><div><div class="card pc-bar"><button id="nxprint">Imprimir ou salvar PDF</button><button class="sec" id="nxdl">Baixar ofício (HTML)</button><button class="sec" id="nxcopy">Copiar texto</button><button class="sec" id="nxclear">Limpar</button>${pres?`<button class="sec" id="nxgab">Preencher gabarito</button>`:""}</div><div class="card" id="nxchk">${nxChk(S)}</div><div id="pc-paper" class="pc-paper">${nxPaper(S)}</div></div></div>`}
const nxChk=S=>`<h3>Conferência</h3><ul class="pc-ck">${nxCheck(S).map(x=>`<li class="${x.ok?"ok":"no"}">${x.ok?"✓":"⚠"} ${esc(x.msg)}</li>`).join("")}</ul>`;
function nxRefresh(){const S=nxGet();document.getElementById("pc-paper").innerHTML=nxPaper(S);document.getElementById("nxchk").innerHTML=nxChk(S)}
function nxBind(){const g=id=>document.getElementById(id);
 document.querySelectorAll("[data-nx]").forEach(i=>{const f=()=>{const S=nxGet();S[i.dataset.nx]=i.value;nxSave(S);nxRefresh()};i.oninput=f;i.onchange=f});
 document.querySelectorAll("[data-nxl]").forEach(i=>i.onchange=()=>{const S=nxGet(),a=S[i.dataset.nxl],ix=a.indexOf(i.value);if(i.checked&&ix<0)a.push(i.value);if(!i.checked&&ix>=0)a.splice(ix,1);nxSave(S);nxRefresh()});
 document.querySelectorAll("[data-nxb]").forEach(i=>i.onchange=()=>{const S=nxGet();S[i.dataset.nxb]=i.checked;nxSave(S);nxRefresh()});
 if(g("nxprint"))g("nxprint").onclick=()=>{try{window.print()}catch(e){}};
 if(g("nxdl"))g("nxdl").onclick=async()=>{const fg=g("pc-paper").outerHTML;const html=`<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oficio_NexoFloat</title><style>${PC_DOCCSS}</style></head><body><div class="pc-wrap"><div class="pc-act"><button onclick="window.print()">Imprimir ou salvar PDF</button><span>Na janela de impressão, escolha “Salvar como PDF”.</span></div>${fg}</div></body></html>`;try{await rtDownload("Oficio_NexoFloat.html",new Blob([html],{type:"text/html"}))}catch(e){g("nxdl").textContent="Não foi possível baixar"}};
 if(g("nxcopy"))g("nxcopy").onclick=async()=>{const fg=[...document.querySelectorAll("#pc-paper .pc-fig")];fg.forEach(x=>x.style.display="none");const t=g("pc-paper").innerText;fg.forEach(x=>x.style.display="");try{await navigator.clipboard.writeText(t);g("nxcopy").textContent="Copiado"}catch(e){g("nxcopy").textContent="Selecione e copie"}};
 if(g("nxclear"))g("nxclear").onclick=()=>{nxSave(Object.assign({},NX_DEF,{fund:[],ped:[]}));route()};
 if(g("nxgab"))g("nxgab").onclick=()=>{const s1=nxT("s1");nxSave({hash:s1.hash,dep:DATA.nexo.dep,dt:"22/10/2026 10:41",fz:"gmt3",fund:NX_FUN.filter(f=>f[2]).map(f=>f[0]),ped:["cad","ip","sai","val"],prazo:"10 dias",email:true,sig:true});route()}}

// ---------- apresentador
let presCache=null;async function getPres(){if(presCache)return presCache;const pin=sessionStorage&&sessionStorage.getItem&&sessionStorage.getItem("sf_pin");if(!pin)return null;try{presCache=JSON.parse(await decrypt(DATA.pres,pin));return presCache}catch(e){return null}}
async function presPage(){const p=await getPres();if(!p)return `<h1>Modo apresentador</h1><div class="card"><form class="search" id="pinf"><input type="password" id="pin" placeholder="PIN do apresentador" autocomplete="off"><button>Entrar</button></form><div id="pm" class="small" style="margin-top:8px"></div></div>`;
 return `<h1>Modo apresentador</h1><div class="card"><h2>Códigos de liberação</h2><table class="t"><thead><tr><th>Ato</th><th>Documento</th><th>Código</th></tr></thead><tbody>${Object.values(p.codes).map(c=>`<tr><td>${c.ato}</td><td>${esc(c.titulo)}</td><td><code>${c.code}</code></td></tr>`).join("")}</tbody></table></div>
 <div class="card"><h2>Gabarito do laboratório</h2><dl class="kv"><dt>Seed de teste</dt><dd class="addr">${esc(p.lab.seed)}</dd><dt>Passphrase</dt><dd><code>${esc(p.lab.pass)}</code></dd><dt>Caminho com saldo</dt><dd><code>${esc(p.lab.path)}</code></dd><dt>Endereço</dt><dd>${aLink(p.lab.addr,true)}</dd><dt>Sem passphrase, 0/0</dt><dd class="addr">${esc(p.lab.semPassphrase)} (vazio)</dd></dl></div>
 <div class="card"><h2>Controles (neste navegador)</h2><div class="row"><button id="tg1" class="sec">${labels()?"Ocultar":"Mostrar"} rótulos nos endereços</button><button id="tg2" class="sec">${frozen()?"Remover":"Aplicar"} congelamento do destino</button><button id="tg4" class="sec">Rastreador: plotar tudo (referência)</button><button id="tg3" class="sec">Reiniciar estado deste navegador</button></div><p class="small">Os alunos não precisam usar estes controles: o congelamento aparece no navegador de cada um quando liberam o documento da emissora.</p></div>`}
// ---------- roteador
const NAV=[["#/","Explorador"],["#/rastreador","Rastreador"],["#/pecas","Peças"],["#/ponte","Ponte Atlas"],["#/nexo","NexoFloat"],["#/cofre","Cofre"],["#/lab","Laboratório"],["#/aurumx","Vitrine AurumX"]];
async function route(){const raw=location.hash||"#/",[pathq,qs]=raw.split("?"),parts=pathq.replace(/^#\//,"").split("/").map(decodeURIComponent),sec=parts[0]||"",qp=new URLSearchParams(qs||"");
 $("#nav").innerHTML=NAV.map(([h,n])=>`<a href="${h}" class="${(h==="#/"&&["","addr","tx","token"].includes(sec))||h==="#/"+sec?"on":""}">${n}</a>`).join("");
 $("#tz").textContent=tz()==="gmt3"?"GMT-3":"UTC";
 const app=$("#app");let html="";const wide=sec==="rastreador"||sec==="pecas"||sec==="nexo";app.style.maxWidth=wide?"none":"";app.style.padding=wide?"14px 12px 40px":"";
 if(!crypto||!crypto.subtle){app.innerHTML='<div class="note">Este navegador não oferece a API de criptografia necessária. Abra a página em HTTPS ou em um navegador atualizado.</div>';return}
 if(sec==="")html=home();else if(sec==="addr")html=addrPage(parts[1]||"");else if(sec==="tx")html=txPage(parts[1]||"");else if(sec==="token")html=tokenPage(parts[1],qp.get("tab"));
 else if(sec==="ponte")html=pontePage(qp.get("q"));else if(sec==="nexo")html=nexoPage(qp.get("q"),!!(await getPres()));else if(sec==="cofre")html=cofrePage();else if(sec==="doc")html=await docPage(parts[1]);
 else if(sec==="lab")html=labPage();else if(sec==="rastreador")html=rtPage();else if(sec==="pecas")html=pcPage(!!(await getPres()));else if(sec==="aurumx")html='<div id="axroot" class="ax"></div>';else if(sec==="apresentador")html=await presPage();else html=home();
 app.className=sec==="aurumx"?"full":"";app.innerHTML=html;window.scrollTo(0,0);if(sec==="aurumx")axRender();bind(sec,parts,qp)}
function bind(sec){const g=id=>document.getElementById(id);if(sec==="rastreador"){rtBind();rtSplash()}if(sec==="pecas")pcBind();if(sec==="nexo")nxBind();
 document.querySelectorAll("[data-plot]").forEach(b=>b.onclick=()=>{const on=rtToggle(b.dataset.plot);if(b.dataset.ic){b.classList.toggle("on",on);b.title=on?"No gráfico (clique para remover)":"Adicionar ao gráfico"}else b.textContent=on?"✓ No gráfico (remover)":"+ Gráfico"});
 document.querySelectorAll("[data-copy]").forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.copy);(b.querySelector(".t")||b).textContent="Copiado"}catch(e){(b.querySelector(".t")||b).textContent="Selecione e copie"}});
 if(g("sf"))g("sf").onsubmit=e=>{e.preventDefault();const q=g("q").value.trim();if(!q)return;
    if(/^(0x)?[0-9a-fA-F]{64}$/.test(q)){location.hash="#/tx/"+q.replace(/^0x/i,"");return}
  if(/^0x[0-9a-fA-F]{40}$/.test(q)||/^T[1-9A-HJ-NP-Za-km-z]{33}$/.test(q)){location.hash="#/addr/"+encodeURIComponent(q);return}
  g("msg").innerHTML='<span class="bad-t">Entrada não reconhecida.</span> Use um endereço (Tron: T…; Ethereum: 0x…) ou um hash de transação.'};
 if(g("bl"))g("bl").onsubmit=e=>{e.preventDefault();const q=g("blq").value.trim(),rede=location.hash.includes("/tron")?"tron":"eth";
  if(!/^0x[0-9a-fA-F]{40}$/.test(q)&&!/^T[1-9A-HJ-NP-Za-km-z]{33}$/.test(q)){g("blr").innerHTML='<div class="note">Endereço inválido.</div>';return}
  const v=rede==="eth"&&frozen()&&q.toLowerCase()===DATA.freeze.addr.toLowerCase();
  g("blr").innerHTML=`<div class="card" style="margin:0"><code>isBlackListed(${esc(short(q))})</code> retorna <b class="${v?"bad-t":"ok-t"}" style="font-size:22px">${v}</b>${v?`<p class="small">Endereço na lista de bloqueio. Veja o evento na aba Eventos.</p>`:`<p class="small">Endereço fora da lista de bloqueio nesta rede.</p>`}</div>`};
 if(g("pf"))g("pf").onsubmit=e=>{e.preventDefault();location.hash="#/ponte?q="+encodeURIComponent(g("pq").value.trim())};
 if(g("nf"))g("nf").onsubmit=e=>{e.preventDefault();location.hash="#/nexo?q="+encodeURIComponent(g("nq").value.trim())};
 if(g("cf"))g("cf").onsubmit=async e=>{e.preventDefault();const code=g("cc").value.trim().toUpperCase();if(!code)return;let found=false;
  for(const d of DATA.docs){try{await decrypt(d.enc,code);const cs=codes();cs[d.id]=code;store.set("sf_codes",JSON.stringify(cs));if(d.id==="emissora")store.set("sf_frozen","1");found=d;break}catch(x){}}
  if(found){g("cm").innerHTML=`<span class="ok-t">Documento liberado: ${esc(found.titulo)}.</span>`+(found.id==="emissora"?" O explorador passou a mostrar o endereço como bloqueado.":"");setTimeout(route,600)}else g("cm").innerHTML='<span class="bad-t">Código inválido.</span>'};
 if(sec==="lab")bindLab();
 if(g("pinf"))g("pinf").onsubmit=async e=>{e.preventDefault();try{const pin=g("pin").value;await decrypt(DATA.pres,pin);try{sessionStorage.setItem("sf_pin",pin)}catch(x){mem.pin=pin}presCache=null;route()}catch(x){g("pm").innerHTML='<span class="bad-t">PIN incorreto.</span>'}};
 if(g("tg1"))g("tg1").onclick=async()=>{if(labels())store.del("sf_labels");else{const p=await getPres();store.set("sf_labels",JSON.stringify(p.labels))}route()};
 if(g("tg2"))g("tg2").onclick=()=>{if(frozen())store.del("sf_frozen");else store.set("sf_frozen","1");route()};
if(g("tg4"))g("tg4").onclick=()=>{rtSet({tx:Object.keys(RT_TX),pos:{},names:{}});location.hash="#/rastreador"};
 if(g("tg3"))g("tg3").onclick=()=>{["sf_codes","sf_frozen","sf_labels","sf_graph","sf_pecas","sf_oficio"].forEach(store.del);route()}}
const THEMES=["auto","light","dark"],theme=()=>store.get("sf_theme")||"auto";
function applyTheme(){const t=THEMES.includes(theme())?theme():"auto",R=document.documentElement;if(t==="auto")R.removeAttribute("data-theme");else R.setAttribute("data-theme",t);
 const b=$("#th");if(b){b.innerHTML=IC[t==="dark"?"moon":t==="light"?"sun":"auto"];b.title="Tema: "+({auto:"automático (segue o aparelho)",light:"claro",dark:"escuro"})[t]+". Clique para alternar."}}
$("#th").onclick=()=>{store.set("sf_theme",THEMES[(THEMES.indexOf(theme())+1)%3]);applyTheme()};applyTheme();
$("#tz").onclick=()=>{store.set("sf_tz",tz()==="gmt3"?"utc":"gmt3");route()};
window.addEventListener("hashchange",route);route();
})();
